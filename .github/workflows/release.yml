name: Release

on:
  push:
    tags:
      - "v*"
  # Manual, publish-free full build: produces the signed/notarized DMGs and
  # the signed exes as run artifacts. Everything publish-side (GitHub
  # Release with its updater feeds, the installer site, homebrew-tap) is tag-gated
  # below, so a branch dispatch cannot create a release named after the
  # branch, overwrite an updater channel, or ping the tap. Do NOT dispatch
  # on an existing v* tag — that re-enters the full publish path against an
  # immutable release.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  MACOSX_DEPLOYMENT_TARGET: "13.0"
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  # Tag-scoped cache entries cannot warm the next release.
  SCCACHE_GHA_RW_MODE: READ_ONLY

jobs:
  # What the tag says (channel, version, build version), checked against the
  # tagged commit before anything builds: `release version` fails unless the
  # workspace version is the tag's (stable) or the stable release the beta
  # follows. Tag runs only; a branch dispatch builds without a build version.
  version:
    name: Release version
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.version.outputs.channel }}
      version: ${{ steps.version.outputs.version }}
      build_version: ${{ steps.version.outputs.build_version }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
    steps:
      # Full history with tags: a beta's build version counts from the stable
      # release tag before it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      # Match CI so Cargo inputs and sccache compiler objects are reusable.
      - name: Align compiler inputs with CI
        run: echo "RUSTFLAGS=-D warnings" >> "$GITHUB_ENV"
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-cargo
          shared-key: linux-stable-debug
          cache-targets: false
          save-if: false
      - name: Read the release version
        id: version
        run: cargo xtask release version --tag "$GITHUB_REF_NAME"
      # A beta tag parses, and publish keeps a beta off the stable side
      # effects, but the rest of the beta path is not ready: `sparkle-deltas`
      # and `appcast` reject a beta, `latest-json` would label it stable, and
      # publish writes no beta channel file. Fail here, before anything is
      # built or signed.
      - name: Refuse a channel publish cannot route
        if: ${{ steps.version.outputs.channel != 'stable' }}
        env:
          CHANNEL: ${{ steps.version.outputs.channel }}
        run: |
          echo "::error::$GITHUB_REF_NAME is a $CHANNEL release; this workflow publishes stable releases only"
          exit 1

  # Build (and sign/notarize) every platform's installers. The build matrix
  # lives in a reusable workflow so PRs / manual dispatches can build the same
  # installers UNSIGNED for testing; here we pass sign: true for the signed,
  # notarized artifacts the publish job ships.
  build:
    name: Build installers
    needs: version
    # A branch dispatch skips `version` and still builds; a tag whose version
    # does not check out builds nothing, so nothing publishes.
    if: ${{ !cancelled() && needs.version.result != 'failure' }}
    uses: ./.github/workflows/build.yml
    # Required so build.yml can read the 1Password / Azure signing secrets.
    secrets: inherit
    permissions:
      contents: read
      id-token: write # build.yml mints an OIDC token for Azure Artifact Signing.
    with:
      # Signing needs the Apple and Azure credentials (1Password). Set the
      # repository variable BETTERLOGI_SIGN_RELEASES to `true` only once they
      # exist; otherwise the installers ship unsigned and still publish.
      sign: ${{ vars.BETTERLOGI_SIGN_RELEASES == 'true' }}
      build_version: ${{ needs.version.outputs.build_version }}

  release-notes:
    name: Generate release notes
    # Tag runs only: the generator diffs from the previous tag, and its only
    # consumer (publish) is tag-gated too. `release version` picks that tag:
    # for a stable release the stable release before it, so the notes cover
    # its betas.
    needs: version
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: .github/scripts/release-notes/pnpm-lock.yaml

      - name: Load Codex release-notes credentials from 1Password
        id: release_notes_config
        continue-on-error: true
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        # Load only fields the item has: one missing field fails the whole
        # step, which leaves every output empty and the notes without Codex.
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CODEX_ACCESS_TOKEN: ${{ secrets.OP_CODEX_SECRET_ITEM }}/credential
          CHATGPT_USERNAME: ${{ secrets.OP_CODEX_SECRET_ITEM }}/username

      - name: Mint release-notes GitHub App token
        id: release_notes_app_token
        continue-on-error: true
        uses: ./.github/actions/github-app-token-from-1password
        with:
          op-service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          op-github-app-item: ${{ secrets.OP_GITHUB_APP_ITEM }}

      - name: Install release-notes dependencies
        run: pnpm --dir .github/scripts/release-notes install --frozen-lockfile

      - name: Generate GitHub Release notes
        env:
          CODEX_ACCESS_TOKEN: ${{ steps.release_notes_config.outputs.CODEX_ACCESS_TOKEN }}
          CHATGPT_USERNAME: ${{ steps.release_notes_config.outputs.CHATGPT_USERNAME }}
          # Optional override; unset, generate.ts picks the endpoint from the
          # credential kind.
          CODEX_ENDPOINT: ${{ vars.CODEX_ENDPOINT }}
          GH_TOKEN: ${{ steps.release_notes_app_token.outputs.token || github.token }}
          PREVIOUS_TAG: ${{ needs.version.outputs.previous_tag }}
        run: |
          set -euo pipefail
          # An empty tag (the first release) compares with nothing.
          node .github/scripts/release-notes/generate.ts \
            --tag "$GITHUB_REF_NAME" \
            --previous-tag "$PREVIOUS_TAG" \
            --output .release/RELEASE_NOTES.md

      - uses: actions/upload-artifact@v7
        with:
          name: BetterLogi-release-notes
          path: .release/RELEASE_NOTES.md

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [version, build, release-notes]
    # Wait for the Windows jobs (so the successful .zip/.msi set can be attached)
    # but do NOT let their failure block the macOS release. `!cancelled()` removes
    # the implicit "all needs succeeded" gate, so the required deps are checked
    # explicitly here — the windows jobs are deliberately absent from this condition.
    # NOTE: after such a partial publish, do NOT "re-run failed jobs" — publish
    # re-runs as build's dependent and fails against the now-immutable release
    # A missed .zip ships
    # with the next tag instead.
    #
    # `needs.build.outputs.macos_result` is the macOS leg's own result, surfaced
    # by build.yml's `results` job — the reusable-workflow job result aggregates
    # all legs, so gating on it would let a failed Windows/Linux leg block the
    # macOS release. The Windows/Linux legs stay best-effort (pattern download).
    if: ${{ github.ref_type == 'tag' && !cancelled() && needs.version.result == 'success' && needs.build.outputs.macos_result == 'success' && needs.release-notes.result == 'success' }}
    # The updater feeds follow the newest release. One publish at a
    # time keeps two tags from interleaving their writes. `queue: max` keeps
    # every waiting publish (up to 100) instead of only the newest one;
    # waiting publishes start in the order they began to wait. The queue does
    # not make a re-run safe: see the NOTE above.
    concurrency:
      group: release-publish
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    env:
      # stable or beta, from the `version` job.
      RELEASE_CHANNEL: ${{ needs.version.outputs.channel }}
    outputs:
      installer_published: ${{ steps.artifacts.outputs.installer }}
    steps:
      # Needed to build & run the xtask manifest generator below.
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # Match CI so Cargo inputs and sccache compiler objects are reusable.
      - name: Align compiler inputs with CI
        run: echo "RUSTFLAGS=-D warnings" >> "$GITHUB_ENV"

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-cargo
          shared-key: linux-stable-debug
          cache-targets: false
          # Tag publish is not a useful cache writer; restore Cargo inputs only.
          save-if: false

      - uses: actions/download-artifact@v8
        with:
          pattern: BetterLogi-macos-dmg-*
          path: dist
          merge-multiple: true

      # Best-effort per arch — deliberately NOT gated on the Windows leg's
      # result: the proven x86_64 zip must not be held hostage by the
      # experimental arm64 leg (or vice versa). Each leg uploads its artifact
      # only after both exes are built, signed, and verified, so whatever
      # arrived is safe to ship. A pattern download that matches nothing
      # succeeds with an empty dist (unlike by-name, which fails).
      - uses: actions/download-artifact@v8
        with:
          pattern: BetterLogi-windows-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: BetterLogi-release-notes
          path: .release

      - uses: actions/download-artifact@v8
        with:
          pattern: BetterLogi-linux-packages-*
          path: dist
          merge-multiple: true

      # Best-effort alongside the packages, and separate from them: the Flatpak
      # leg builds the whole workspace again inside the SDK, so it is the
      # slowest Linux job and the one most likely to be the single leg missing.
      - uses: actions/download-artifact@v8
        with:
          pattern: BetterLogi-linux-flatpak-*
          path: dist
          merge-multiple: true

      - name: Stage Linux installer
        if: ${{ needs.build.outputs.linux_result == 'success' }}
        run: |
          # Publish the installer only when both Linux matrix legs completed.
          # Otherwise latest could select a package that the partial release
          # does not contain.
          install -m755 packaging/linux/install.sh dist/install.sh

      - name: Generate checksums
        run: |
          cd dist
          # The DMGs are the release gate — fail loudly if none arrived (with
          # nullglob alone, sha256sum with zero args would silently hash stdin).
          compgen -G '*.dmg' > /dev/null
          # nullglob: when the Windows job didn't ship a .zip, *.zip drops to
          # nothing instead of erroring on a literal pattern, so the DMGs are
          # hashed alone. The Windows portable artifact is a zip of the GUI +
          # agent exes (#347); no bare .exe ships anymore.
          shopt -s nullglob
          artifacts=(*.dmg *.zip *.msi *.deb *.rpm *.pkg.tar.zst *.flatpak)
          if [ -f install.sh ]; then
            artifacts=(install.sh "${artifacts[@]}")
          fi
          sha256sum -- "${artifacts[@]}" > SHA256SUMS

      # softprops' `files` can't list a glob that matches nothing without
      # tripping fail_on_unmatched_files. The Windows zip/msi (per arch leg)
      # and the Linux artifacts are all best-effort — only the DMGs,
      # SHA256SUMS and the DMG .minisig set are guaranteed by the publish gate.
      # The installer is present only with a complete Linux build. Record what
      # actually arrived so a failed Windows or Linux leg can still degrade to
      # a smaller release instead of blocking the macOS one.
      - name: Detect best-effort artifacts
        id: artifacts
        run: |
          if [ -f dist/install.sh ]; then
            echo "installer=true" >> "$GITHUB_OUTPUT"
          else
            echo "installer=false" >> "$GITHUB_OUTPUT"
          fi
          for ext in zip msi deb rpm flatpak; do
            if compgen -G "dist/*.$ext" > /dev/null; then
              echo "$ext=true" >> "$GITHUB_OUTPUT"
            else
              echo "$ext=false" >> "$GITHUB_OUTPUT"
            fi
          done
          if compgen -G "dist/*.pkg.tar.zst" > /dev/null; then
            echo "pacman=true" >> "$GITHUB_OUTPUT"
          else
            echo "pacman=false" >> "$GITHUB_OUTPUT"
          fi

      # Feeds and installers are GitHub Release assets of this repository: the
      # app reads `releases/latest/download/latest.json`. Keys are plain
      # repository secrets.
      - name: Validate updater signing configuration
        id: r2_config
        env:
          BETTERLOGI_UPDATE_MINISIGN_PUBLIC_KEY: ${{ secrets.BETTERLOGI_UPDATE_MINISIGN_PUBLIC_KEY }}
          BETTERLOGI_UPDATE_MINISIGN_SECRET_KEY: ${{ secrets.BETTERLOGI_UPDATE_MINISIGN_SECRET_KEY }}
          BETTERLOGI_SPARKLE_PUBLIC_ED_KEY: ${{ secrets.BETTERLOGI_SPARKLE_PUBLIC_ED_KEY }}
          BETTERLOGI_SPARKLE_PRIVATE_ED_KEY: ${{ secrets.BETTERLOGI_SPARKLE_PRIVATE_ED_KEY }}
        run: |
          set -euo pipefail
          : "${BETTERLOGI_UPDATE_MINISIGN_PUBLIC_KEY:?Set the BETTERLOGI_UPDATE_MINISIGN_PUBLIC_KEY repository secret}"
          : "${BETTERLOGI_UPDATE_MINISIGN_SECRET_KEY:?Set the BETTERLOGI_UPDATE_MINISIGN_SECRET_KEY repository secret}"
          : "${BETTERLOGI_SPARKLE_PUBLIC_ED_KEY:?Set the BETTERLOGI_SPARKLE_PUBLIC_ED_KEY repository secret}"
          : "${BETTERLOGI_SPARKLE_PRIVATE_ED_KEY:?Set the BETTERLOGI_SPARKLE_PRIVATE_ED_KEY repository secret}"
          installer_key=$(sed -n 's/^MINISIGN_PUBLIC_KEY=//p' packaging/linux/install.sh)
          if [ "$installer_key" != "$BETTERLOGI_UPDATE_MINISIGN_PUBLIC_KEY" ]; then
            echo "The Linux installer minisign public key does not match the release key." >&2
            exit 1
          fi
          echo "BETTERLOGI_UPDATE_BASE_URL=https://github.com/${GITHUB_REPOSITORY}/releases" >> "$GITHUB_OUTPUT"

      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign

      - name: Sign release artifacts with minisign
        env:
          BETTERLOGI_UPDATE_MINISIGN_PUBLIC_KEY: ${{ secrets.BETTERLOGI_UPDATE_MINISIGN_PUBLIC_KEY }}
          BETTERLOGI_UPDATE_MINISIGN_SECRET_KEY: ${{ secrets.BETTERLOGI_UPDATE_MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          key_file="${RUNNER_TEMP}/betterlogi-minisign.key"
          umask 077
          trap 'rm -f "$key_file"' EXIT
          # The secret key file is stored base64-encoded in 1Password so its two
          # lines survive paste/round-trip (a raw multi-line value can have its
          # newline mangled to a space — see the GitHub App key note above).
          # `tr -d` drops any wrapping whitespace before decoding.
          printf '%s' "$BETTERLOGI_UPDATE_MINISIGN_SECRET_KEY" | tr -d '[:space:]' | base64 -d > "$key_file"
          # The installer, Windows binaries, and Linux packages get the same
          # minisign treatment as the DMGs: manual verification today, and the
          # future auto-updaters need detached signatures for every artifact.
          # The Flatpak bundle is attached to the release like
          # the rest, so leaving it unsigned would make it the one installer a
          # user cannot verify.
          # nullglob: the zip/msi/deb/rpm/flatpak sets are best-effort per arch
          # leg, so the globs may match nothing; the DMGs are guaranteed by the
          # publish gate.
          shopt -s nullglob
          artifacts=(dist/*.dmg dist/*.zip dist/*.msi dist/*.deb dist/*.rpm dist/*.pkg.tar.zst dist/*.flatpak)
          if [ -f dist/install.sh ]; then
            artifacts=(dist/install.sh "${artifacts[@]}")
          fi
          for artifact in "${artifacts[@]}"; do
            minisign -S -m "$artifact" -s "$key_file" -x "$artifact.minisig" -W
            minisign -V -m "$artifact" -P "$BETTERLOGI_UPDATE_MINISIGN_PUBLIC_KEY" -x "$artifact.minisig"
          done

      - name: Generate static updater manifest
        env:
          BETTERLOGI_UPDATE_BASE_URL: ${{ steps.r2_config.outputs.BETTERLOGI_UPDATE_BASE_URL }}
        run: |
          set -euo pipefail
          cargo run -p xtask -- release latest-json \
            --dist dist \
            --tag "$GITHUB_REF_NAME" \
            --base-url "$BETTERLOGI_UPDATE_BASE_URL" \
            --include-windows \
            --output dist/latest.json

      # After the build legs stapled the DMGs: stapling rewrites the file, and
      # the EdDSA signature must cover the bytes users download. The feeds stay
      # outside dist, which is uploaded as release assets. xtask reads the
      # private key from the environment only, and refuses one that does not
      # match the public key the bundles embed. Each feed also lists the
      # Sparkle deltas the macOS build leg made for its DMG, signed here too.
      - name: Generate Sparkle appcasts
        env:
          BETTERLOGI_UPDATE_BASE_URL: ${{ steps.r2_config.outputs.BETTERLOGI_UPDATE_BASE_URL }}
          BETTERLOGI_SPARKLE_PUBLIC_ED_KEY: ${{ secrets.BETTERLOGI_SPARKLE_PUBLIC_ED_KEY }}
          BETTERLOGI_SPARKLE_PRIVATE_ED_KEY: ${{ secrets.BETTERLOGI_SPARKLE_PRIVATE_ED_KEY }}
        run: |
          set -euo pipefail
          cargo run -p xtask -- release appcast \
            --dist dist \
            --tag "$GITHUB_REF_NAME" \
            --base-url "$BETTERLOGI_UPDATE_BASE_URL" \
            --release-notes .release/RELEASE_NOTES.md \
            --output-dir .release/appcast

      - name: Stage updater feeds as release assets
        run: cp .release/appcast/appcast-*.xml dist/

      # Create the draft, upload assets to it, then publish. For a stable
      # release, `draft` is false, so softprops creates the release as a
      # draft, uploads every file, and only then flips it to published. That
      # keeps the release mutable for the whole upload, which is what avoids
      # the "immutable release" rejection. A beta is a prerelease, and
      # softprops publishes a prerelease before its upload unless `draft` is
      # true: a beta stays a draft here, and the next step publishes it.
      # latest.json and the appcasts are attached: the app reads them from
      # the latest release.
      # RELEASE_NOTES.md is kept outside dist for the same reason.
      - name: Publish GitHub Release with assets
        uses: softprops/action-gh-release@v3
        with:
          body_path: .release/RELEASE_NOTES.md
          draft: ${{ env.RELEASE_CHANNEL != 'stable' }}
          prerelease: ${{ env.RELEASE_CHANNEL != 'stable' }}
          make_latest: ${{ env.RELEASE_CHANNEL == 'stable' }}
          files: |
            ${{ steps.artifacts.outputs.installer == 'true' && 'dist/install.sh' || '' }}
            dist/*.dmg
            dist/*.minisig
            dist/SHA256SUMS
            dist/latest.json
            dist/appcast-*.xml
            ${{ steps.artifacts.outputs.zip == 'true' && 'dist/*.zip' || '' }}
            ${{ steps.artifacts.outputs.msi == 'true' && 'dist/*.msi' || '' }}
            ${{ steps.artifacts.outputs.deb == 'true' && 'dist/*.deb' || '' }}
            ${{ steps.artifacts.outputs.rpm == 'true' && 'dist/*.rpm' || '' }}
            ${{ steps.artifacts.outputs.pacman == 'true' && 'dist/*.pkg.tar.zst' || '' }}
            ${{ steps.artifacts.outputs.flatpak == 'true' && 'dist/*.flatpak' || '' }}
          fail_on_unmatched_files: true

      - name: Publish the prerelease
        if: ${{ env.RELEASE_CHANNEL != 'stable' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
