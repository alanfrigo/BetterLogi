# nfpm package descriptor for BetterLogi Linux packages (.deb / .rpm / .pkg.tar.zst).
#
# Build with the xtask:
#   cargo run -p xtask -- linux package
#
# Or directly (requires nfpm in PATH; set VERSION and PKG_ARCH):
#   VERSION=0.6.0 PKG_ARCH=amd64 nfpm package --packager deb --target target/release
#   VERSION=0.6.0 PKG_ARCH=arm64 nfpm package --packager rpm --target target/release
#   VERSION=0.6.0 PKG_ARCH=amd64 nfpm package --packager archlinux --target target/release

name: betterlogi
version: "${VERSION}"
arch: "${PKG_ARCH}"
maintainer: Alan Frigo <alanfrigo@outlook.com>
description: |-
  Logitech HID++ device control — remap buttons, DPI, and SmartShift.
  An open-source, local-first alternative to Logi Options+. No account,
  no telemetry; configuration lives in a plain TOML file.
homepage: https://github.com/alanfrigo/BetterLogi
license: Apache-2.0 OR MIT

contents:
  # ── binaries ────────────────────────────────────────────────────────────────
  - src: target/release/betterlogi
    dst: /usr/bin/betterlogi
    file_info:
      mode: 0755

  - src: target/release/betterlogi-desktop
    dst: /usr/bin/betterlogi-desktop
    file_info:
      mode: 0755

  - src: target/release/betterlogi-overlay
    dst: /usr/bin/betterlogi-overlay
    file_info:
      mode: 0755

  - src: target/release/betterlogi-agent
    dst: /usr/bin/betterlogi-agent
    file_info:
      mode: 0755

  # ── udev rules ──────────────────────────────────────────────────────────────
  - src: packaging/linux/udev/70-betterlogi.rules
    dst: /etc/udev/rules.d/70-betterlogi.rules
    file_info:
      mode: 0644

  # ── systemd user unit ───────────────────────────────────────────────────────
  - src: packaging/linux/systemd/betterlogi-agent.service
    dst: /usr/lib/systemd/user/betterlogi-agent.service
    file_info:
      mode: 0644

  # ── XDG desktop entry ───────────────────────────────────────────────────────
  - src: packaging/linux/desktop/betterlogi.desktop
    dst: /usr/share/applications/betterlogi.desktop
    file_info:
      mode: 0644

  # ── icon ────────────────────────────────────────────────────────────────────
  # Every standard indexed hicolor size, not just the 1024 master: a stock
  # `hicolor/index.theme` stops at 512x512, so a launcher that resolves icons
  # by theme index (KDE's kbuildsycoca, most GTK launchers) finds nothing at
  # all when only `1024x1024/apps` is installed.
  - src: design/icon/openlogi.png
    dst: /usr/share/icons/hicolor/1024x1024/apps/betterlogi.png
    file_info:
      mode: 0644
  - src: design/icon/openlogi-512.png
    dst: /usr/share/icons/hicolor/512x512/apps/betterlogi.png
    file_info:
      mode: 0644
  - src: design/icon/openlogi-256.png
    dst: /usr/share/icons/hicolor/256x256/apps/betterlogi.png
    file_info:
      mode: 0644
  - src: design/icon/openlogi-128.png
    dst: /usr/share/icons/hicolor/128x128/apps/betterlogi.png
    file_info:
      mode: 0644
  - src: design/icon/openlogi-64.png
    dst: /usr/share/icons/hicolor/64x64/apps/betterlogi.png
    file_info:
      mode: 0644
  - src: design/icon/openlogi-48.png
    dst: /usr/share/icons/hicolor/48x48/apps/betterlogi.png
    file_info:
      mode: 0644
  - src: design/icon/openlogi-32.png
    dst: /usr/share/icons/hicolor/32x32/apps/betterlogi.png
    file_info:
      mode: 0644
  - src: design/icon/openlogi-16.png
    dst: /usr/share/icons/hicolor/16x16/apps/betterlogi.png
    file_info:
      mode: 0644

  - src: LICENSE-APACHE
    dst: /usr/share/licenses/betterlogi/LICENSE-APACHE
    file_info:
      mode: 0644

  - src: LICENSE-MIT
    dst: /usr/share/licenses/betterlogi/LICENSE-MIT
    file_info:
      mode: 0644

archlinux:
  packager: "Alan Frigo <alanfrigo@outlook.com>"

overrides:
  deb:
    depends:
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libxcb1
  archlinux:
    depends:
      - dbus
      - fontconfig
      - gcc-libs
      - glibc
      - libglvnd
      - libxcb
      - libxkbcommon
      - libxkbcommon-x11
      - vulkan-icd-loader
      - wayland

scripts:
  postinstall: packaging/linux/nfpm-scripts/postinstall.sh
  postremove: packaging/linux/nfpm-scripts/postremove.sh
