[package]
name = "betterlogi-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Implementation library for the BetterLogi CLI (the `betterlogi` binary)."
keywords = ["logitech", "hidpp", "hid", "mouse", "cli"]
categories = ["command-line-utilities", "hardware-support"]

[dependencies]
betterlogi-core = { path = "../betterlogi-core", version = "0.8.17", features = ["logging", "worker"] }
betterlogi-device = { path = "../betterlogi-device", version = "0.8.17" }
betterlogi-fixture = { workspace = true, features = ["fs"] }
betterlogi-hid = { path = "../betterlogi-hid", version = "0.8.17" }
betterlogi-camera = { path = "../betterlogi-camera", version = "0.8.17" }
betterlogi-assets = { path = "../betterlogi-assets", version = "0.8.17" }
betterlogi-ipc = { path = "../betterlogi-ipc", version = "0.8.17" }
atomic-write-file = { workspace = true }
tarpc = { workspace = true }
png = "0.17"
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
futures = "0.3"
betterlogi-ipc = { path = "../betterlogi-ipc", version = "0.8.17", features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true
