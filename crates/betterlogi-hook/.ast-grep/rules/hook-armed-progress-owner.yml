# Owner: macos::watchdog::WatchdogSignals::mark_armed — progress before the short budget.
id: hook-armed-progress-owner
language: rust
severity: error
message: Use WatchdogSignals::mark_armed so fresh progress is visible before the short watchdog budget applies.
files:
  - crates/betterlogi-hook/src/**/*.rs
ignores:
  - crates/betterlogi-hook/src/macos/watchdog.rs
rule:
  pattern: $SIGNALS.set_phase(TapPhase::Armed)
